schema: spec-driven
context: |
  Arch Linux / Omarchy desktop. Warlock-authored production uses Elm and Haskell only.
  All GUI elements and GUI interaction state are Elm; Haskell owns backend and reviewed native/runtime integration.
  Preserve one authoritative policy owner per decision, validated typed IPC and original receipt/deadline semantics.
  No authored production runtime in other languages may hide behind an allowed-language wrapper.
  Development QA/formal tools, generated Elm output and separately inventoried system libraries are distinct from authored product payload.
  Preserve 242 requirement identities and 417 scenario identities, behavior, native gates and immutable historical evidence.
  Current EARS implementation-language changes are explicit versioned revisions, never silent baseline replacement.
  Existing passes do not accept replacement implementations; require source/evidence correspondence.
  Use the repository Elm/Haskell skills, AgentBus, Scrapling research, living wiki, Quint and meaningful property/sequence fuzzing.
  Preparation mode is armed for authorized architecture/interface/source/tool/plugin/model/fuzz readiness work.
  Final implementation mode remains gated by independently reviewed minimum design readiness, not full release completion.
  Adopted source placement: private-network Elm/WebKit plus Haskell UI/local HTTP owner, one host-side Haskell native authority.
  Ordinary application launch retains its host session/network context; GUI interaction policy remains Elm.
  Intended owned socketpair IPC has strict typed framing and no FD transfer, proxy or general bus grants.
  Native operations remain empty until actual issuer/admission/effect/certificate paths are qualified.
  Host feasibility STOP2 and all original deadlines/history remain; source design adopts no native execution admission.
  Hyprland compatibility remains required; any compositor replacement requires separate explicit feasibility admission.
  Require hardware GPU acceleration and qualify the actual selected host.
