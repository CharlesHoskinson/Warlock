# Run the provenance-aware copy of the crash watcher instead of the stock one,
# so crashes from test harnesses and dev tools don't pop "diagnose with AI"
# toasts while real desktop crashes still do. See the header of
# ~/.local/bin/omarchy-crash-watch-filtered and ~/Documents/crash-noise/FINAL.md.
# To undo: delete this file, then
#   systemctl --user daemon-reload && systemctl --user restart omarchy-crash-watch
[Service]
ExecStart=
ExecStart=%h/.local/bin/omarchy-crash-watch-filtered
