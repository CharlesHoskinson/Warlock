<!doctype html>
<html lang="en" data-warlock-design="v1" data-theme="high-contrast" style="font-size:200%">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Taskbar at 200% text</title><link rel="icon" href="data:,"><link rel="stylesheet" href="../../assets/shared/specimen-bootstrap.css"><link rel="stylesheet" href="../foundations/theme.css"><link rel="stylesheet" href="../foundations/tokens.css"><link rel="stylesheet" href="theme.css"><script src="specimen-interactions.js" defer></script><style>body{margin:0;background:var(--wl-sys-color-canvas);color:var(--wl-sys-color-text);font:400 .875rem/1.4 Inter,sans-serif}p{margin:12px}.frame{position:relative;margin-block:12px}.panel{position:absolute;z-index:5;right:6px;top:100%;width:min(90%,360px);padding:12px;background:var(--wl-sys-color-surface-raised);border:1px solid var(--wl-sys-color-border-essential);font-size:.75rem}.panel[hidden]{display:none}</style></head>
<body><p>High contrast · 200% · effects off</p><div class="frame"><div class="surface-bar" data-theme="high-contrast" data-effects="off" data-motion="reduced" data-text-scale="200"><div class="surface-actions" role="toolbar" aria-label="Warlock taskbar" data-document-focus="true">
<button class="control-group" data-surface-control="bar:group:application:editor" data-window-state="active" data-active-application="true" data-window-focused="true" aria-pressed="true" aria-label="Minimize Documentation and project workspace editor; Active"><span class="control-label">Documentation and project workspace editor</span><span class="control-detail">Active; 2 windows</span></button>
<button class="control-group" data-surface-control="bar:pin:files" data-window-state="open" aria-label="Open Files; Pinned launcher"><span class="control-label">Files</span><span class="control-detail">Pinned launcher</span></button>
<button class="control-group" data-surface-control="bar:group:application:terminal" data-window-state="minimized" aria-label="Restore Terminal; Minimized"><span class="control-label">Terminal</span><span class="control-detail">Minimized</span></button>
<button class="control-utility" data-surface-control="bar:applications"><span class="control-label">Applications</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:overview"><span class="control-label">Task View</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:switcher"><span class="control-label">Switch windows</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:notifications"><span class="control-label">Notifications</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:files"><span class="control-label">Files</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:system"><span class="control-label">System</span><span class="control-detail"></span></button><button class="control-utility" data-surface-control="bar:settings"><span class="control-label">Settings</span><span class="control-detail"></span></button></div><span class="surface-status" role="status" aria-live="off">Restore: not confirmed for selected window. Check your windows; Refresh only reads status.</span><button class="control-status-disclosure" data-specimen-disclosure aria-expanded="false" aria-controls="full-status">Window status</button></div><div class="panel" id="full-status" hidden>Restore: not confirmed for selected window. Check your windows; Refresh only reads status.</div></div>
<p>Document focus lost · observed cues remain</p><div class="frame"><div class="surface-bar" data-theme="high-contrast" data-effects="off" data-motion="reduced"><div class="surface-actions" role="toolbar" aria-label="Taskbar without document focus" data-document-focus="false"><button class="control-group" data-surface-control="bar:group:application:editor" data-window-state="active" data-active-application="true" data-window-focused="true" aria-pressed="true"><span class="control-label">Editor</span><span class="control-detail">Active; 2 windows</span></button><button class="control-utility" data-surface-control="bar:applications"><span class="control-label">Applications</span><span class="control-detail"></span></button></div><span class="surface-status surface-status-idle" role="status" aria-live="off">Ready</span></div></div></body></html>
