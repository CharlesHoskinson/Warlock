<?xml version="1.0" encoding="UTF-8"?>
<!-- Proposal only: inside a fresh 0700 /tmp/warlock-ux031 in a private mount/net/PID namespace. -->
<busconfig>
  <type>session</type>
  <listen>unix:path=/tmp/warlock-ux031/bus</listen>
  <auth>EXTERNAL</auth>
  <policy context="default">
    <allow own="org.freedesktop.Notifications"/>
    <allow send_destination="org.freedesktop.DBus"/>
    <allow send_destination="org.freedesktop.Notifications"/>
    <allow send_interface="org.freedesktop.Notifications"/>
    <allow receive_sender="org.freedesktop.DBus"/>
    <allow receive_interface="org.freedesktop.Notifications"/>
    <allow send_type="method_return" send_requested_reply="true"/>
    <allow send_type="error" send_requested_reply="true"/>
    <allow receive_type="method_return"/>
    <allow receive_type="error"/>
  </policy>
</busconfig>
